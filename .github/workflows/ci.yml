name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: packages/documents/scripts/requirements-test.txt
      - name: Install the pinned workspace
        run: bun install --frozen-lockfile
      - name: Check source
        run: bun run check
      - name: Test application rules
        run: bun run test
      - name: Install document test dependencies
        run: "python -m pip install --only-binary=:all: -r packages/documents/scripts/requirements-test.txt"
      - name: Test document revision boundaries
        run: python packages/documents/scripts/test_revise_document.py
